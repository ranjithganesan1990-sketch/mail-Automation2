# =============================================================
#  RENDER BLUEPRINT — Mail Automation  (FREE TIER — for testing)
#
#  One Web Service serves BOTH the Express API and the built React
#  dashboard from the same origin, so the relative `/api/...` calls in
#  web/src/lib/api.ts work with no CORS and no second hostname.
#
#  Deploy:  Render Dashboard -> New + -> Blueprint -> pick this repo.
#  Change `region` below if you want a datacentre closer to your users
#  (oregon | ohio | virginia | frankfurt | singapore).
#
#  FREE-TIER CAVEATS — these change behaviour, not just speed. See
#  DEPLOY-RENDER.md "Free-tier limits" before trusting it with real sends:
#    1. The instance sleeps after ~15 min idle, which freezes node-cron.
#       Scheduled campaigns fire whenever somebody next loads the site.
#    2. No disk is allowed, so attachments are wiped on every redeploy,
#       restart and wake-from-sleep.
#    3. The free database is deleted 30 days after creation.
#
#  To go to production, restore the paid settings — the four spots are
#  marked "PROD:" below (the pre-change file is also in git at 113354b).
# =============================================================

databases:
  - name: mail-automation-db
    databaseName: mail_automation
    user: mail_automation

    plan: free             # PROD: basic-256mb
    region: singapore

services:
  - type: web
    name: mail-automation
    runtime: node
    plan: free             # PROD: starter -- always-on, so node-cron keeps
                           # firing daily sends and follow-ups on schedule
    region: singapore
    branch: main

    # --include=dev is mandatory: NODE_ENV=production would otherwise make npm
    # skip typescript / vite / prisma, which are all build-time tools here.
    buildCommand: npm install --include=dev && npm run db:generate && npm run build

    # db:deploy runs in the runtime environment, where the internal DATABASE_URL
    # is reachable (a build container cannot see the private network).
    #
    # TEMPORARY: `npm run seed` creates the demo workspace
    # (demo@mailautomation.app / demo12345). Free instances have no shell, so
    # seeding has to ride along with the start command. Remove the seed step
    # once the demo data exists -- the seed upserts, so re-running is harmless
    # to the data, but it re-hashes the demo password with bcrypt on every
    # restart and wake-from-sleep, which is wasted CPU on a 0.1-core instance.
    #
    # `|| true` matters: without it a failed seed aborts the whole start
    # command and takes the service down, rather than just skipping demo data.
    startCommand: npm run db:deploy && (npm run seed || true) && npm run start

    healthCheckPath: /api/health

    # PROD: add a disk here, or attachments vanish on every redeploy and
    # campaigns referencing them fail at send time. Disks are not available
    # on the free plan, which is why this block is absent.
    #
    # disk:
    #   name: uploads
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: mail-automation-db
          property: connectionString

      # Generated once by Render and then held stable.
      # WARNING: rotating ENCRYPTION_KEY makes every stored Gmail refresh token
      # undecryptable — connected mailboxes would all need re-authorising.
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # APP_URL / API_URL / GOOGLE_REDIRECT_URI are left unset on purpose:
      # server/src/env.ts falls back to RENDER_EXTERNAL_URL, which Render
      # injects with this service's real https:// address.

      - key: UPLOAD_DIR
        value: uploads     # PROD: /var/data/uploads (the mounted disk)
      - key: MAX_UPLOAD_BYTES
        value: "15728640"

      # Optional. Can also be set at runtime under Settings -> Google OAuth.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # AI reply suggestions in the Inbox. Server-side only.
      # Without it the Inbox works and the Generate button explains it is off.
      - key: GROQ_API_KEY
        sync: false

      # Optional. Leave blank to run everything on the Free plan.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
